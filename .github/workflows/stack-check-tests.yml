name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # shellcheck is pre-installed on ubuntu runners; -S error keeps
      # pre-existing style/info-level findings from failing CI.
      - name: ShellCheck
        run: shellcheck -S error install.sh install-stack.sh verify-readiness.sh stack-check

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/stack-check.bats
